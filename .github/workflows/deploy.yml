name: Deploy Vite React App to GitHub Pages

on:
  push:
    branches: ['main'] # main 브랜치에 push될 때 실행 (브랜치명이 master라면 master로 변경)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  # 이미 배포 중인 작업을 취소하지 않고, 다음 배포가 순서대로 기다리게 합니다.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
